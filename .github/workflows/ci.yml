name: ci
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Uses only tooling already in the repo (pnpm 9 / tsc / next lint). Node 22 matches
# the Vercel project setting (nodeVersion 22.x).
# Production installs on Vercel currently use `npm install` + package-lock.json
# (root vercel.json) — see DEVLOG/audit-2026-10/platform-build-deps.md.
jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      # Blocking. `next build` also type-checks, so anything that fails here
      # would fail the Vercel production build too.
      - name: Typecheck (apps/web)
        run: pnpm --filter @kraft/web run typecheck

  lint:
    runs-on: ubuntu-latest
    # Blocking: lint was brought to 0 errors on 2026-10-12 (see DEVLOG).
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Lint (apps/web)
        run: pnpm --filter @kraft/web run lint

  build:
    runs-on: ubuntu-latest
    needs: typecheck
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Build Web
        run: pnpm -r --filter @kraft/web build
